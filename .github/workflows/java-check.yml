name: Java Check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Chapter 1–2 programs
        working-directory: ch01-02-intro-and-elementary-programming/src
        run: |
          javac *.java
